<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>User Settings</title>
</head>
<body>

 <input type="checkbox" id="settings-toggle" class="modal-toggle">

 <label for="settings-toggle" class="btn-open"><h1>⚙ Open Settings</h1></label>

 <div class="settings-box">
  <form method="POST" action="#" enctype="multipart/form-data">
   <fieldset>
     <h1 id="user23">User Settings</h1>

    <div class="profile-upload-section">
     <div class="avatar-preview">P</div>

     <div class="profile-info">
      <h3 class="profile-display-name" id="displayNameText">Your Name</h3>
      <div class="upload-controls">
        <label class="file-input-btn" for="avatarInput">Change avatar</label>
        <input type="file" id="avatarInput" name="avatar" accept="image/*">
      </div>
     </div>
    </div>

    <div class="form-group">
     <label for="full_name">Name</label>
     <input type="text" id="full_name" name="full_name" placeholder="Enter name here..." required oninput="document.getElementById('displayNameText').textContent = this.value.trim() || 'Your Name'">
    </div>

    <div class="form-group">
     <label for="bio">Bio</label>
     <textarea id="bio" name="bio" placeholder="Tell us a bit about you" required></textarea>
    </div>

    <div class="form-group">
     <label for="notes">Notes</label>
     <input type="text" id="notes" name="notes" placeholder="Notes (only visible to you)">
    </div>

    <div class="form-group">
     <label for="birthday">Birthday</label>
     <input type="date" id="birthday" name="birthday">
    </div>

    <div class="form-group">
     <label for="connection">Add Connection</label>
     <select id="connection" name="connection">
      <optgroup label="Gaming">
        <option value="steam">Steam</option>
        <option value="riot">Riot Games</option>
      </optgroup>
      <optgroup label="Social">
        <option value="instagram">Instagram</option>
        <option value="spotify">Spotify</option>
      </optgroup>
     </select>
    </div>

    <div class="form-group">
     <label>Status</label>
     <div class="choice-group">
      <label><input type="radio" name="status" value="online" checked> Online</label>
      <label><input type="radio" name="status" value="offline"> Offline</label>
     </div>
    </div>

    <div class="form-group">
     <label>Options</label>
     <p class="hint-text">Check options to apply settings</p>
     <div class="choice-group">
      <label><input type="checkbox" name="show_conn" value="yes"> Show Connections</label>
      <label><input type="checkbox" name="allow_dm" value="yes"> Allow DMs</label>
     </div>
    </div>

    <div class="action-row">
     <input type="submit" class="btn-submit" value="Save Changes">
     <label for="settings-toggle" class="btn-close">Close</label>
    </div>

   </fieldset>
  </form>
 </div>

</body>
</html>
